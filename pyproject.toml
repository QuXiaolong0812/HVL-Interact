[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hvl-interact"
version = "0.1.0"
description = "Hierarchical vision-language alignment for dual-person interaction action recognition"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "torch>=2.6,<3",
  "transformers>=4.49,<5",
  "numpy>=1.26,<3",
  "Pillow>=10.4,<13",
  "PyYAML>=6.0.2,<7",
  "safetensors>=0.5,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=6,<7", "ruff==0.11.13", "build>=1.2,<2"]

[project.scripts]
hvl-interact = "hvl_interact.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

